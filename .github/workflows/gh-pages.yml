name: Build and Deploy to Pages

on:
  push:
    branches: ["deploy"]

  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads the pnpm version from `packageManager` in package.json
        name: Install pnpm
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}} # the build fetches GitHub star counts for Code links (src/lib/github.ts)
      - run: pnpm run deploy-actions
        env: 
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}