- id: ConceptAttention
  title: "ConceptAttention: Diffusion Transformers Learn Highly Interpretable Features"
  shortTitle: "ConceptAttention"
  tagline: "Diffusion transformers secretly segment concepts" # the core contribution, shown under the title on the home page
  slug: concept-attention # the work's page on this site: /research/concept-attention
  abstract: >-
    Do the rich representations of multi-modal diffusion transformers (DiTs) exhibit unique properties that enhance their interpretability?
    We introduce ConceptAttention, a novel method that leverages the expressive power of DiT attention layers to generate high-quality saliency maps that precisely locate textual concepts within images.
    Without requiring additional training, ConceptAttention repurposes the parameters of DiT attention layers to produce highly contextualized concept embeddings, contributing the major discovery that performing linear projections in the output space of DiT attention layers yields significantly sharper saliency maps compared to commonly used cross-attention maps.
    ConceptAttention even achieves state-of-the-art performance on zero-shot image segmentation benchmarks, outperforming 15 other zero-shot interpretability methods on the ImageNet-Segmentation dataset.
    ConceptAttention works for popular image models and even seamlessly generalizes to video generation.
    Our work contributes the first evidence that the representations of multi-modal DiTs are highly transferable to vision tasks like segmentation.
