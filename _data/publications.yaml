- id: CRAM
  title: "Classical Energies Learn to Reason 1,000x Faster than Looped Models"
  shortTitle: CRAM
  tagline: "1980s physics, trained to reason in milliseconds" # the core contribution, shown under the title on the home page
  slug: cram # the work's page on this site: /research/cram
  abstract: >-
    Looped models have emerged as a prominent paradigm for reasoning, with successes on simple reasoning puzzles such as Sudoku-Extreme and Maze-Unique.
    However, these models can be unstable, slow to train, and use many parameters and FLOPs to solve simple puzzles.
    Descent on an energy not only mitigates these issues but also offers advantages: built-in early stopping, compute that adapts to problem difficulty, fast training without differentiating through a solver, and interpretable weights that learn the constraints of the puzzle.
    Here we demonstrate this with a learned version of Hopfield & Tank's energy from the 80s, which we term CRAM, solves 99.996% of Sudoku-Extreme and 100% of Maze-Unique test puzzles after 42 ms and 132 ms of training on one GPU, at least 1,000x faster than looped models on these tasks.
    CRAM also matches baseline looped models at their highest accuracy on Sudoku-Extreme using at least 282x fewer inference FLOPs.
    Our work suggests two things.
    First, that energies are an extremely promising direction for training reasoning from data.
    Second, a caution against using trivially solvable benchmarks like Sudoku and Maze to test the scalability of looped reasoning techniques.
