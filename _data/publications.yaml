- id: DiffusionExplainer
  title: "Diffusion Explainer: Visual Explanation for Text-to-image Stable Diffusion"
  shortTitle: Diffusion Explainer
  tagline: "See how Stable Diffusion turns text into images" # the core contribution, shown under the title on the home page
  slug: diffusion-explainer # the work's page on this site: /research/diffusion-explainer
  abstract: >-
    Diffusion-based generative models' impressive ability to create convincing images has garnered global attention.
    However, their complex structures and operations often pose challenges for non-experts to grasp.
    We present Diffusion Explainer, the first interactive visualization tool that explains how Stable Diffusion transforms text prompts into images.
    Diffusion Explainer tightly integrates a visual overview of Stable Diffusion's complex structure with explanations of the underlying operations.
    By comparing image generation of prompt variants, users can discover the impact of keyword changes on image generation.
    A 56-participant user study demonstrates that Diffusion Explainer offers substantial learning benefits to non-experts.
    Our tool has been used by over 10,300 users from 124 countries at https://poloclub.github.io/diffusion-explainer/.
