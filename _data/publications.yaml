- id: AMTutorial
  title: "Tutorial on Modern Methods in Associative Memory"
  shortTitle: "Tutorial on Associative Memory"
  tagline: "A modern tour of Associative Memory" # the core contribution, shown under the title on the home page
  slug: am-tutorial # the work's page on this site: /research/am-tutorial
  abstract: >-
    Associative Memories like the famous Hopfield Networks are elegant models for describing fully recurrent neural networks whose fundamental job is to store and retrieve information.
    In the past few years they experienced a surge of interest due to novel theoretical results pertaining to their information storage capabilities, and their relationship with SOTA AI architectures, such as Transformers and Diffusion Models.
    These connections open up possibilities for interpreting the computation of traditional AI networks through the theoretical lens of Associative Memories.
    Additionally, novel Lagrangian formulations of these networks make it possible to design powerful distributed models that learn useful representations and inform the design of novel architectures.
    This tutorial provides an approachable introduction to Associative Memories, emphasizing the modern language and methods used in this area of research, with practical hands-on mathematical derivations and coding notebooks.
