- id: TransformerExplainer
  title: "Transformer Explainer: Interactive Learning of Text-Generative Models"
  shortTitle: Transformer Explainer
  tagline: "See inside a live GPT-2, in your browser" # the core contribution, shown under the title on the home page
  slug: transformer-explainer # the work's page on this site: /research/transformer-explainer
  abstract: >-
    The Transformer architecture underpins modern large language models powering state-of-the-art text generation and AI applications.
    However, its complexity makes it difficult for non-experts to learn.
    Existing resources often lack interactivity, rely on static descriptions of simplified architectures, or fail to reflect models' behavior with real data.
    To address this gap, we introduce Transformer Explainer, an interactive visualization tool for non-experts to learn Transformers.
    The tool integrates an overview illustrating the Transformer's data flow with on-demand explanations that gradually reveal mathematical details.
    Smooth transitions across abstraction levels highlight the interplay between high-level structures and low-level operations.
    Running a live GPT-2 instance directly in the browser, Transformer Explainer empowers learners to experiment with custom input and hyperparameters without setup, observing next-token predictions in real time.
    A 90-participant user study showed that our tool offered significant advantages in improving user understanding and engagement.
    Transformer Explainer has attracted over 490,000 users.
  category: vis
  authors:
