    Building efficient, interpretable, and robust AI from energy-based models of memory and reasoning. Leading the first of these, <a href="https://prefrontal.ai/news/cram/">CRAM</a>, a classical energy that learns to reason at least 1,000x faster than looped models; also contributing to subquadratic attention for ultra-long context (<a href="https://prefrontal.ai/news/lsa/">Latent Sparse Attention</a>).

