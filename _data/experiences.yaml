    Built open-source tools to inspect language models (<a href="https://exbert.vizhub.ai">exBERT</a>, <a href="http://lmdiff.net/">LMdiff</a>) and showed that transformers learn to map atoms in chemical reactions without labels (<a href="http://rxnmapper.ai/">RXNMapper</a>, Science Advances). Then, with Dmitry Krotov, developed energy-based Associative Memories that scale to modern architectures: <a href="https://bhoov.com/research/energy-transformer">Energy Transformer</a>, <a href="https://bhoov.github.io/hamux/">HAMUX</a>, and Dense Associative Memories with random features and Epanechnikov energies.
